name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.16.10
      - name: Lint
        run: ruff check .
      - name: Test
        # Tests stub all HTTP. No token is configured, so nothing can reach the live CRM.
        run: python -m pytest -q
